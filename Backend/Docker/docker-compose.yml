services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in Backend/Docker/.env (see .env.example)}"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  sqlinit:
    image: mcr.microsoft.com/mssql-tools
    container_name: sqlinit
    environment:
      SQLCMDPASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in Backend/Docker/.env (see .env.example)}"
    depends_on:
      - sqlserver
    volumes:
      - ./db/init.sql:/init.sql
    entrypoint: >
      bash -c "
        echo 'Waiting for SQL Server to be available...' &&
        sleep 20 &&
        /opt/mssql-tools/bin/sqlcmd -S sqlserver -U SA -i /init.sql
      "

volumes:
  sql_data:
