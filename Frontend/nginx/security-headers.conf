# Security headers, included in every location: nginx drops server-level add_header lines in any
# location that has its own add_header, so they can't simply go in the server block.
add_header Content-Security-Policy $fv_csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security $fv_hsts always;
